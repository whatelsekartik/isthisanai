<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cadence</title>
<meta name="description" content="A dumb little chatbot." />
<meta name="color-scheme" content="light dark" />
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2317181a'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="/">Cadence</a>
    <span class="status" id="status" data-state="loading" role="status" aria-live="polite">
      <i aria-hidden="true"></i><span id="status-text">loading</span>
    </span>
    <div class="bar-right">
      <button class="quiet" id="settings-btn" type="button" aria-expanded="false" aria-controls="settings" aria-haspopup="dialog">settings</button>
    </div>
  </header>

  <main class="log" id="log" tabindex="-1">
    <div class="empty" id="empty">A dumb little chatbot.</div>
    <ol class="thread" id="thread" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Conversation" hidden></ol>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <label class="sr-only" for="input">Message</label>
    <textarea class="input" id="input" rows="1" placeholder="Say something" enterkeyhint="send"
              spellcheck="false" autocapitalize="sentences"></textarea>
    <button class="stop" id="stop" type="button" hidden>Stop</button>
    <button class="send" id="send" type="submit" disabled>Send</button>
  </form>

  <div class="panel" id="settings" role="dialog" aria-modal="false" aria-label="Generation settings" hidden>
    <div id="sliders"></div>
    <div class="panel-foot">
      <button type="button" id="reset">Reset</button>
      <span class="hint" id="engine-hint"></span>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
